name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly cache-free rebuild of every image. Alpine keeps only the newest
    # revision of a package per branch, so an exact apk pin stops resolving
    # with no change in this repository; the pull-request build would hide
    # that behind the GHA layer cache until someone touched the Dockerfile.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip '.[test]'
      - name: Run standalone unit tests
        run: make test
      - name: Build and smoke-test wheel
        run: |
          python -m pip wheel --no-deps . -w dist
          python -m pip install --force-reinstall dist/*.whl
          python -c "from sandbox_platform.sandbox_client import Sandbox; assert Sandbox('smoke').name == 'smoke'"
          sandbox --help >/dev/null
          sandbox-mcp --help >/dev/null
          sandboxctl --help >/dev/null
      - name: Guard the wheel's installed top-level surface
        run: python scripts/check-wheel-surface.py dist/*.whl

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm --prefix console ci --ignore-scripts
      - run: npm --prefix console run test:i18n
      - run: npm --prefix console run lint
      - run: npm --prefix console run typecheck
      - run: npm --prefix console run build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Validate scripts and manifests
        run: |
          bash -n scripts/*.sh
          kubectl kustomize k8s >/dev/null
          kubectl kustomize overlays/rwo-single-node >/dev/null
          kubectl kustomize overlays/local >/dev/null
          kubectl kustomize overlays/eks >/dev/null
          kubectl kustomize overlays/external-deps >/dev/null
          make chart-lint
          make chart-render

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            context: .
            dockerfile: runtime/Dockerfile
          - name: file-service
            context: .
            dockerfile: file-service/Dockerfile
          - name: control-plane
            context: .
            dockerfile: control_plane/Dockerfile
          - name: console
            context: console
            dockerfile: console/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: sandbox-${{ matrix.name }}:ci
          # The scheduled run must reach apk and pip for real, so it neither
          # reads the layer cache nor is offered one. Written as
          # `cond && value || ''` deliberately: the reverse form
          # `cond && '' || value` always yields value, because '' is falsy.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: ${{ github.event_name != 'schedule' && 'type=gha' || '' }}
          cache-to: type=gha,mode=max

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 \
            --output "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan complete Git history
        run: /tmp/gitleaks git --redact --verbose --no-banner -c .gitleaks.toml .

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
