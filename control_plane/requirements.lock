# Control-plane database drivers for the Control Plane image (pip --require-hashes).
#
# Every entry carries the sha256 of the exact PyPI artifacts. To add or bump a
# package, download the wheel and sdist and hash them, then paste both hashes:
#   python3 -m pip download --no-deps --dest /tmp/lock "NAME==VERSION"
#   python3 -m pip download --no-deps --no-binary :all: --dest /tmp/lock "NAME==VERSION"
#   python3 -m pip hash /tmp/lock/*
# A package that is imported by control_plane/store.py but absent here builds fine and
# only fails at runtime (SANDBOX_STORE_BACKEND=mysql shipped that way once), so
# control_plane/Dockerfile imports every driver during the build as a guard.

