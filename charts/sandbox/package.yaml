apiVersion: infra.convee.io/v1alpha1
kind: Package
metadata:
  name: sandbox
spec:
  category: WorkloadPackage
  namespace: sandbox-system
  namespaceMode: values
  source:
    type: oci
    repoURL: oci://ghcr.io/hullwork/charts/sandbox
    path: .
    renderer: helm
  capabilities:
    requires:
      - kubernetes.api
      - runtimeclass.gvisor
      - storage.rwx
      - object-storage.s3
    provides:
      - sandbox.control-plane
      - sandbox.runtime
      - workspace.posix
      - checkpoint.s3
