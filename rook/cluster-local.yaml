apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    # v20.2.4, pinned to the multi-architecture index digest (amd64 and
    # arm64) so the tag cannot be re-pointed underneath the local profile.
    # rook/loop-device.yaml carries the same digest; move both together.
    image: quay.io/ceph/ceph:v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  mon:
    count: 1
    allowMultiplePerNode: true
  mgr:
    count: 1
    allowMultiplePerNode: true
  dashboard:
    enabled: false
  crashCollector:
    disable: true
  storage:
    # The local Runtime worker is intentionally compute-only. The installer
    # substitutes the trusted control-plane node name before applying this
    # manifest, so Rook never probes or consumes a Runtime-worker device.
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: __SANDBOX_CONTROL_PLANE_NODE__
        devices:
          - name: /dev/loop0
  disruptionManagement:
    managePodBudgets: false
  priorityClassNames:
    all: system-cluster-critical
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: object-store
  namespace: rook-ceph
spec:
  metadataPool:
    failureDomain: host
    replicated:
      size: 1
      requireSafeReplicaSize: false
  dataPool:
    failureDomain: host
    replicated:
      size: 1
      requireSafeReplicaSize: false
  preservePoolsOnDelete: true
  gateway:
    port: 80
    instances: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 2Gi
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: sandbox-runtime
  namespace: rook-ceph
spec:
  store: object-store
  displayName: Sandbox Runtime
  quotas:
    maxBuckets: 3
---
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: sandbox-filesystem
  namespace: rook-ceph
spec:
  metadataPool:
    replicated:
      size: 1
      requireSafeReplicaSize: false
  dataPools:
    - name: replicated
      failureDomain: host
      replicated:
        size: 1
        requireSafeReplicaSize: false
  metadataServer:
    activeCount: 1
    activeStandby: false
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sandbox-rwx
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph
  fsName: sandbox-filesystem
  pool: sandbox-filesystem-replicated
  # Lima's Ubuntu Noble kernel is 6.8 and cannot consume Ceph 20.2.4 AES256K
  # keys. Keep secure keys and use the matching v3.17.1 userspace client.
  mounter: fuse
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
