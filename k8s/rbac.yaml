apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-control-plane
  namespace: sandbox-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-ticket-leases
  namespace: sandbox-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-ticket-leases
  namespace: sandbox-system
subjects:
  - kind: ServiceAccount
    name: sandbox-control-plane
    namespace: sandbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-ticket-leases
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-lifecycle
  namespace: sandbox-workloads
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list"]
  # Required only when per-workspace PVC mode is enabled by a provider overlay.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-control-plane
  namespace: sandbox-workloads
subjects:
  - kind: ServiceAccount
    name: sandbox-control-plane
    namespace: sandbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-lifecycle
---
# Monitoring is deliberately read-only and cluster-scoped. Nodes are not
# namespaced. Pod metrics stay in the workload Role above, so Control Plane cannot read
# metrics from other namespaces. Lifecycle mutation remains confined there too.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-monitoring
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-monitoring
subjects:
  - kind: ServiceAccount
    name: sandbox-control-plane
    namespace: sandbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-monitoring
