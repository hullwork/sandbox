# Sandbox Console is a client of Control Plane and has no Kubernetes credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-console
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-console
    app.kubernetes.io/managed-by: sandbox-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-console
        app.kubernetes.io/managed-by: sandbox-controller
    spec:
 # The panel does not touch the Kubernetes API, and all data goes through the Control Plane. Hanging SA token will only be out of thin air
 # One more exploitable credential.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: sandbox-console:0.1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
 # Ready only looks at nginx itself: when the Control Plane is not healthy, it is even more important that the panel can be opened - the one on the first screen
 # health card carries the endpoint and a diagnosis and is the first place to troubleshoot. Tying readiness
 # to the Control Plane would turn "storage is down" straight into "even the panel cannot be opened".
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
 # The deployment embeds no credentials: neither inject control-plane-token nor do Basic Auth.
 # The identity is supplied by the user in the browser (Authorization: Bearer <key>),
 # Authorization determination is all in the Control Plane. It turns out that the two keys sandbox-console-auth that were hung are both
 # No longer required - see the prerequisite change instructions in the sandbox/console/nginx.conf header for details.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-console
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-console
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: sandbox-console
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
