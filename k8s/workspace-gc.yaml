apiVersion: batch/v1
kind: CronJob
metadata:
  name: sandbox-workspace-gc
  namespace: sandbox-workloads
  labels:
    app.kubernetes.io/name: sandbox-workspace-gc
    app.kubernetes.io/managed-by: sandbox-controller
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sandbox-workspace-gc
            app.kubernetes.io/managed-by: sandbox-controller
        spec:
 #Scheduling no longer pins nodes (Phase 2 flip, see volume-agent.yaml description):
 # Any node under RWX storage can do GC.
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: workspace-gc
              image: sandbox-file-service:0.3.0
              imagePullPolicy: Never
              command: ["python3", "/app/gc_workspaces.py"]
              env:
                - name: WORKSPACE_GC_ROOT
                  value: /workspaces
                - name: WORKSPACE_DATA_TTL_SECONDS
                  value: "2592000"
                - name: WORKSPACE_GC_DRY_RUN
                  value: "false"
              resources:
                requests:
                  cpu: 10m
                  memory: 24Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: workspaces
                  mountPath: /workspaces
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: workspaces
              persistentVolumeClaim:
                claimName: sandbox-workspaces
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
