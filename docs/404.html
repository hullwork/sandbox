<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090d" />
    <title>Not found · Sandbox Platform</title>
    <link rel="icon" href="./assets/sandbox-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/site.css" />
    <style>
      main { min-height: 100vh; display: grid; place-items: center; padding: 32px; text-align: center; }
      .error-code { color: #a7ff83; font: 12px ui-monospace, monospace; letter-spacing: .15em; }
      h1 { margin: 20px 0; font-size: clamp(52px, 10vw, 96px); }
      p { max-width: 500px; margin: 0 auto 30px; color: #9aa7a3; font-size: 18px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <img src="./assets/sandbox-mark.svg" alt="" width="64" height="64" />
        <div class="error-code">RUNTIME_NOT_FOUND · 404</div>
        <h1>Outside the sandbox.</h1>
        <p>This route does not exist. The good news: nothing fell back to the host.</p>
        <a class="button primary" href="./">Return to safety <span aria-hidden="true">→</span></a>
      </div>
    </main>
  </body>
</html>
