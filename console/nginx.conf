# Reverse-proxy layer for Sandbox Console.
#
# Its responsibility is to forward browser requests to Control Plane. It performs no
# identity transformation.
#
# The old model supported one operator identity: Nginx authenticated users with
# auth_basic and overwrote Authorization with a static Control Plane bearer token.
# The current model serves platform operators and tenants, each supplying their
# own `Authorization: Bearer <key>` header. Both old mechanisms had to change
# together: token injection would erase the caller's identity, while Basic auth
# consumes the same Authorization header and rejects bearer credentials. This
# layer therefore holds no credentials; Control Plane performs authorization and scopes
# workspaces and runtimes by tenant.
#
# File browsing uses the same path. Control Plane accepts ordinary credentials for the
# read-only file subset and requires a workspace-scoped token for writes.

server {
    listen 8080;
    server_name _;
    resolver __SANDBOX_RESOLVER__ valid=10s ipv6=off;
    set $sandbox_control_plane_upstream sandbox-control-plane.sandbox-system.svc.cluster.local:8080;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # connect-src 'self' is intentional: the Console talks only to its own
    # origin, and Control Plane's internal address must not appear in the browser.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Forward browser Authorization headers verbatim for /v1. Keep the explicit
    # proxy_set_header statement visible so it is not removed as redundant.
    location /v1/ {
        proxy_pass http://$sandbox_control_plane_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Control Plane's /healthz is unauthenticated, but a 503 body can disclose the
    # internal object-store endpoint and diagnostics. Use auth_request against
    # /v1/whoami so only a valid admin, tenant, or legacy credential is allowed.
    # The subrequest inherits this request's Authorization header.
    location = /healthz {
        auth_request /internal-authz;
        proxy_pass http://$sandbox_control_plane_upstream/healthz;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $request_id;
    }

    # auth_request target. Marking it internal prevents direct browser probing
    # outside normal request logging.
    location = /internal-authz {
        internal;
        proxy_pass http://$sandbox_control_plane_upstream/v1/whoami;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $request_id;
    }

    # Container probes describe Nginx only. Coupling them to Control Plane would make
    # a normal Control Plane rollout repeatedly kill a healthy Console.
    location = /livez {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Embedded observability panel, forwarded to Control Plane on this same origin.
    # Pointing the <iframe> straight at Grafana would mean opening frame-src in
    # the CSP above, turning on allow_embedding and cookie_samesite=none in
    # Grafana, and leaving a Grafana credential in the browser. Here the browser
    # only ever talks to this origin and Control Plane holds the service-account token.
    #
    # ^~ so this beats the static fallback below. This layer still holds no
    # credentials and makes no authorization decision: Control Plane answers 401
    # without a session, 403 for a non-administrator or a path outside
    # control_plane/grafana_proxy.ALLOWED, and 404 when no Grafana is configured.
    #
    # 🔴 A location-level add_header replaces the server-level set entirely, so
    # the panel policy is restated here in full. It must: this response is the
    # framed document, and the Console's own frame-ancestors 'none' would make
    # the browser refuse to render the Console's own iframe. The policy string
    # is asserted equal to control_plane/grafana_proxy.PANEL_CSP by
    # tests/test_grafana_embed.py - editing one copy alone fails that test
    # instead of silently blanking the panel in production.
    location ^~ /grafana/ {
        proxy_pass http://$sandbox_control_plane_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self' data:; form-action 'none'; frame-ancestors 'self'; img-src 'self' data: blob:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Static assets are public. They contain no credentials; Control Plane protects
    # all data and actions, so unauthenticated users see only the login form.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
