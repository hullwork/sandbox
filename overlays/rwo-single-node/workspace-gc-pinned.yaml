apiVersion: batch/v1
kind: CronJob
metadata:
  name: sandbox-workspace-gc
  namespace: sandbox-workloads
spec:
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            sandbox.hullwork.com/node-role: runtime
          tolerations:
            - key: sandbox.hullwork.com/node-role
              operator: Equal
              value: runtime
              effect: NoSchedule
