# Buckets are initialized through the runtime identity generated by Rook. Ceph
# cluster lifecycle stays outside Kustomize because its CRDs/operator must exist
# before this local profile is applied.
apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-object-store-init
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-object-store-init
    app.kubernetes.io/managed-by: sandbox-controller
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-object-store-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: sandbox-control-plane:0.7.0
          imagePullPolicy: Never
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until mc alias set dev "$OBJECT_STORE_ENDPOINT" "$OBJECT_STORE_ACCESS_KEY" "$OBJECT_STORE_SECRET_KEY"; do
                sleep 2
              done
              mc mb --ignore-existing "dev/$OBJECT_STORE_UPLOAD_BUCKET"
              mc mb --ignore-existing "dev/$OBJECT_STORE_AGENT_BUCKET"
              mc mb --ignore-existing "dev/$OBJECT_STORE_WORKSPACE_BUCKET"
              mc version enable "dev/$OBJECT_STORE_UPLOAD_BUCKET"
              mc version enable "dev/$OBJECT_STORE_AGENT_BUCKET"
              mc version enable "dev/$OBJECT_STORE_WORKSPACE_BUCKET"
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/mc
            - name: OBJECT_STORE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: object-store-config
                  key: endpoint
            - name: OBJECT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: access-key
            - name: OBJECT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: secret-key
            - name: OBJECT_STORE_UPLOAD_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: object-store-config
                  key: upload-bucket
            - name: OBJECT_STORE_AGENT_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: object-store-config
                  key: agent-bucket
            - name: OBJECT_STORE_WORKSPACE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: object-store-config
                  key: workspace-bucket
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
