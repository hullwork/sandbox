# Buckets are initialized through the runtime identity generated by Rook. Ceph
# cluster lifecycle stays outside Kustomize because its CRDs/operator must exist
# before this local profile is applied.
apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-object-store-init
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-object-store-init
    app.kubernetes.io/managed-by: sandbox-controller
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-object-store-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: sandbox-control-plane:0.7.0
          imagePullPolicy: Never
          command: ["python3", "-c"]
          args:
            - |
              import os
              import sys
              import time

              import boto3
              from botocore.config import Config
              from botocore.exceptions import BotoCoreError, ClientError

              store = boto3.client(
                  "s3",
                  endpoint_url=os.environ["OBJECT_STORE_ENDPOINT"],
                  aws_access_key_id=os.environ["OBJECT_STORE_ACCESS_KEY"],
                  aws_secret_access_key=os.environ["OBJECT_STORE_SECRET_KEY"],
                  config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
              )

              # Bounded, unlike the `until mc alias set ...; do sleep 2; done`
              # this replaced. That loop had no ceiling, and `set -e` does not
              # apply inside an `until` condition, so a missing binary spun
              # forever: the container never exited, backoffLimit never applied,
              # and `make up-local` hung with no error anywhere.
              deadline = time.monotonic() + 120
              while True:
                  try:
                      store.list_buckets()
                      break
                  except (ClientError, BotoCoreError) as error:
                      if time.monotonic() >= deadline:
                          print(f"object store not reachable after 120s: {error}", file=sys.stderr)
                          raise SystemExit(1)
                      time.sleep(2)

              for variable in (
                  "OBJECT_STORE_UPLOAD_BUCKET",
                  "OBJECT_STORE_AGENT_BUCKET",
                  "OBJECT_STORE_WORKSPACE_BUCKET",
              ):
                  bucket = os.environ[variable]
                  try:
                      store.create_bucket(Bucket=bucket)
                  except ClientError as error:
                      code = error.response.get("Error", {}).get("Code", "")
                      if code not in ("BucketAlreadyExists", "BucketAlreadyOwnedByYou"):
                          raise
                  store.put_bucket_versioning(
                      Bucket=bucket,
                      VersioningConfiguration={"Status": "Enabled"},
                  )
                  print(f"{bucket}: created and versioned")
          env:
            - name: OBJECT_STORE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: object-store-config
                  key: endpoint
            - name: OBJECT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: access-key
            - name: OBJECT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: secret-key
            - name: OBJECT_STORE_UPLOAD_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: object-store-config
                  key: upload-bucket
            - name: OBJECT_STORE_AGENT_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: object-store-config
                  key: agent-bucket
            - name: OBJECT_STORE_WORKSPACE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: object-store-config
                  key: workspace-bucket
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
