[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandbox-platform"
version = "0.1.0"
description = "Execution-as-a-service SDK, MCP bridge, and operator CLI for Sandbox Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hullwork" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/hullwork/sandbox"
Repository = "https://github.com/hullwork/sandbox"
Issues = "https://github.com/hullwork/sandbox/issues"

[project.scripts]
sandbox-mcp = "sandbox_platform.mcp:main"
sandbox = "sandbox_platform.sandbox_cli:main"
sandboxctl = "sandbox_platform.sandboxctl:main"

[project.optional-dependencies]
# boto3 is a Control Plane runtime dependency, pinned with hashes in
# control_plane/requirements.lock and installed into that image. It is here so
# the suite can import control_plane.core, and deliberately *not* in
# [project.dependencies]: the published wheel is the SDK, and an SDK consumer
# has no reason to acquire an S3 client. CI installs only this extra, which is
# how a machine that happened to have boto3 already could run the whole suite
# green while CI could not import a single test module.
test = ["PyYAML>=6.0,<7", "boto3>=1.36,<2"]

[tool.hatch.build.targets.wheel]
# The wheel ships only the supported client surface, namespaced under
# sandbox_platform so it never shadows the PyPI `mcp` SDK. Control Plane, Runtime, and
# Kubernetes resources are distributed through container images and manifests.
packages = ["sandbox_platform"]
# Editable installs expose exactly this package instead of adding the
# repository root to sys.path (which would leak control_plane/, runtime/, tests/).
dev-mode-exact = true

[tool.hatch.build.targets.sdist]
include = [
  "sandbox_platform/",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
